name: Keep-Alive Render Backend

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Ping at $(date -u)"
          curl -fsS --max-time 60 https://telefonia-ecasa.onrender.com/api/health
          echo ""
          echo "Done at $(date -u)"