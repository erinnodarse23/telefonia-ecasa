# ===================================================================
# PERFIL: dev - desarrollo local
# - Carga .env (si existe) para tener las variables a mano
# - Defaults seguros para que funcione incluso sin .env
# ===================================================================

spring:
  # Solo dev: carga .env del directorio de trabajo
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Sobreescribe el ${DB_PASSWORD} sin default del base
    password: ${DB_PASSWORD:postgres}

  cache:
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

app:
  # Solo dev: si no hay JWT_SECRET, usa este (NO usar en prod)
  jwt-secret: ${JWT_SECRET:dev-secret-que-solo-sirve-para-local-no-usar-en-produccion-jamas}
  security:
    token-cleanup:
      # En dev igual: cada hora (puedes forzarlo a "0 */1 * * * *" para pruebas)
      cron: ${TOKEN_CLEANUP_CRON:0 0 * * * *}

logging:
  level:
    cu.ecasa.api: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.springframework.web: DEBUG
    org.springframework.scheduling: DEBUG