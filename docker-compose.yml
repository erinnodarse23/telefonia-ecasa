# ============================================================
# Docker Compose — Sistema de Control de Telefonía ECASA
# PostgreSQL 16 + Backend Spring Boot + Frontend React/Nginx
#
# Uso:
#   1. cp .env.example .env  (editar valores)
#   2. docker compose up --build
#   3. Abrir http://localhost:5173 (login: admin / admin123)
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: telefonia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ecasa_telefonica}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_full_schema.sql:/docker-entrypoint-initdb.d/01_full_schema.sql:ro
      - ./database/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
      - ./database/03_migrar_plan_anual.sql:/docker-entrypoint-initdb.d/03_migrar_plan_anual.sql:ro
      - ./database/05_add_unique_consumo.sql:/docker-entrypoint-initdb.d/05_add_unique_consumo.sql:ro
      - ./database/05_fix_discrepancias.sql:/docker-entrypoint-initdb.d/05_fix_discrepancias.sql:ro
      - ./database/05_umbral_ueb.sql:/docker-entrypoint-initdb.d/05_umbral_ueb.sql:ro
      - ./database/06_add_tokens_invalidados.sql:/docker-entrypoint-initdb.d/06_add_tokens_invalidados.sql:ro
      - ./database/06_usuario_ueb_id.sql:/docker-entrypoint-initdb.d/06_usuario_ueb_id.sql:ro
      - ./database/07_indices_dashboard.sql:/docker-entrypoint-initdb.d/07_indices_dashboard.sql:ro
      - ./database/08_configuracion_upsert.sql:/docker-entrypoint-initdb.d/08_configuracion_upsert.sql:ro
    networks:
      - telefonia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecasa_telefonica}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telefonia-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecasa_telefonica}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TZ: ${TZ:-UTC}
    ports:
      - "5001:5001"
    networks:
      - telefonia-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5001/api}
    container_name: telefonia-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"
    networks:
      - telefonia-net

volumes:
  postgres_data:
    driver: local

networks:
  telefonia-net:
    driver: bridge
